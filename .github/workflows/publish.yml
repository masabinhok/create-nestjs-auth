name: Publish to npm

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # npm trusted publishing (OIDC) needs npm 11.5+, which ships with Node 24.
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Cleanup test output
        run: rm -rf test-output

      # Uses OIDC trusted publishing - no token required
      # Configure at: https://www.npmjs.com/package/create-nestjs-auth/access
      - name: Publish to npm
        run: npm publish --provenance --access public
